name: Kiểm thử cài đặt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    name: vendor tái tạo từ upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Tarball vendor khớp bản đóng gói lại từ npm (chỉ đổi peer metadata)
        run: python3 scripts/rebuild-vendor.py

  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # npm ci trên runner Windows có lúc chậm (5-9 phút mỗi tarball): smoke và bootstrap mỗi bước cài một root mới.
    timeout-minutes: 120
    env:
      CI: 'true'
      npm_config_timing: 'true'
      npm_config_loglevel: verbose
      npm_config_fetch_timeout: '60000'
      npm_config_fetch_retries: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - name: Kiểm tra repo public
        run: npm run check
      - name: Unit tests không dùng credential
        run: npm test
      - name: Cài đầy đủ và thử runtime với provider giả
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-debug
        run: npm run smoke
      - name: Bootstrap Unix với đường dẫn có khoảng trắng
        if: runner.os != 'Windows'
        shell: bash
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-debug
          PI_CONFIG_SOURCE: ${{ github.workspace }}
          PI_CONFIG_BOOTSTRAP_DIR: ${{ runner.temp }}/bootstrap toolchain
          PI_CONFIG_FRESH_TOOLCHAIN: '1'
        run: >-
          bash install.sh --root "$RUNNER_TEMP/bootstrap smoke/platform"
          --agent-dir "$RUNNER_TEMP/bootstrap smoke/agent"
          --bin-dir "$RUNNER_TEMP/bootstrap smoke/bin" --no-path
      - name: Bootstrap PowerShell với đường dẫn có khoảng trắng
        if: runner.os == 'Windows'
        shell: powershell
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-debug
          PI_CONFIG_SOURCE: ${{ github.workspace }}
          PI_CONFIG_BOOTSTRAP_DIR: ${{ runner.temp }}\bootstrap toolchain
          PI_CONFIG_FRESH_TOOLCHAIN: '1'
        run: |
          $BootstrapArguments = @(
            '--root', $env:PI_CONFIG_SMOKE_ROOT,
            '--agent-dir', $env:PI_CONFIG_SMOKE_AGENT_DIR,
            '--bin-dir', $env:PI_CONFIG_SMOKE_BIN_DIR, '--no-path'
          )
          & .\install.ps1 @BootstrapArguments
          # File mode needs BOM for Windows PowerShell 5.1 Vietnamese text. Text
          # execution must remove it, exactly as the public one-liner does.
          $DownloadedText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes((Join-Path $PWD 'install.ps1')))
          $BootstrapText = $DownloadedText.TrimStart([char]0xFEFF)
          & ([scriptblock]::Create($BootstrapText)) @BootstrapArguments
      - name: add-path.ps1 giữ PATH của user dạng REG_EXPAND_SZ
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $raw = { $key.GetValue('Path', $null, [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames) }
          $key.SetValue('Path', '%USERPROFILE%\pi-probe;C:\Tools', [Microsoft.Win32.RegistryValueKind]::ExpandString)
          & .\lib\add-path.ps1 -Directory 'C:\pi bin'
          & .\lib\add-path.ps1 -Directory 'C:\pi bin\'
          & .\lib\add-path.ps1 -Directory "$env:USERPROFILE\pi-probe"
          $value = & $raw
          if ($value -ne 'C:\pi bin;%USERPROFILE%\pi-probe;C:\Tools') { throw "unexpected Path: $value" }
          if ($key.GetValueKind('Path') -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) { throw "Path is no longer REG_EXPAND_SZ" }
          $key.DeleteValue('Path')
          & .\lib\add-path.ps1 -Directory 'C:\pi bin'
          if ((& $raw) -ne 'C:\pi bin') { throw "unexpected Path when empty: $(& $raw)" }
          $key.Close()
      - name: Chẩn đoán npm Windows khi thất bại
        if: failure() && runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\npm-debug" -Filter '*debug*.log' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 3 |
            ForEach-Object { Write-Host $_.Name; Get-Content -LiteralPath $_.FullName -Tail 100 }
