name: Kiểm thử cài đặt

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CI: 'true'
      npm_config_timing: 'true'
      npm_config_loglevel: verbose
      npm_config_fetch_timeout: '60000'
      npm_config_fetch_retries: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - name: Kiểm tra repo public
        run: npm run check
      - name: Unit tests không dùng credential
        run: npm test
      - name: Cài đầy đủ và thử runtime với provider giả
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-debug
        run: npm run smoke
      - name: Bootstrap Unix với đường dẫn có khoảng trắng
        if: runner.os != 'Windows'
        shell: bash
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-debug
          PI_CONFIG_SOURCE: ${{ github.workspace }}
          PI_CONFIG_BOOTSTRAP_DIR: ${{ runner.temp }}/bootstrap toolchain
          PI_CONFIG_FRESH_TOOLCHAIN: '1'
        run: >-
          bash install.sh --root "$RUNNER_TEMP/bootstrap smoke/platform"
          --agent-dir "$RUNNER_TEMP/bootstrap smoke/agent"
          --bin-dir "$RUNNER_TEMP/bootstrap smoke/bin" --no-path
      - name: Bootstrap PowerShell với đường dẫn có khoảng trắng
        if: runner.os == 'Windows'
        shell: powershell
        env:
          npm_config_logs_dir: ${{ runner.temp }}/npm-debug
          PI_CONFIG_SOURCE: ${{ github.workspace }}
          PI_CONFIG_BOOTSTRAP_DIR: ${{ runner.temp }}\bootstrap toolchain
          PI_CONFIG_FRESH_TOOLCHAIN: '1'
        run: |
          $BootstrapArguments = @(
            '--root', "$env:RUNNER_TEMP\bootstrap smoke\platform",
            '--agent-dir', "$env:RUNNER_TEMP\bootstrap smoke\agent",
            '--bin-dir', "$env:RUNNER_TEMP\bootstrap smoke\bin", '--no-path'
          )
          & .\install.ps1 @BootstrapArguments
          # GetString keeps the UTF-8 BOM, unlike ReadAllText. Exercise the same
          # text execution path as the public one-liner, including BOM handling.
          $BootstrapText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes((Join-Path $PWD 'install.ps1')))
          & ([scriptblock]::Create($BootstrapText)) @BootstrapArguments
          # Also cover the conventional "irm URL | iex" entrypoint. The function
          # supplies isolated installer paths through the normal automatic args.
          function Test-PipedBootstrap {
            $BootstrapText | Invoke-Expression
          }
          Test-PipedBootstrap @BootstrapArguments
      - name: Chẩn đoán npm Windows khi thất bại
        if: failure() && runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\npm-debug" -Filter '*debug*.log' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 3 |
            ForEach-Object { Write-Host $_.Name; Get-Content -LiteralPath $_.FullName -Tail 100 }
